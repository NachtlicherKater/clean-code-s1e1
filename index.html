<!DOCTYPE html>
<html lang="en">
 <head>
  <title>Todo App</title>
  <link 
        href="https://fonts.googleapis.com/css?family=Lato:300,400,700" 
        rel="stylesheet" 
        type="text/css"
  >
  <link rel="stylesheet" href="style.css" media="screen">
 </head>
 <body class="page">
  <aside class="ad-banner">
    <img 
         class="ad-banner__image"
         src="./assets/eisenhower-matrix.jpg" 
         alt="Eisenhower matrix"
    >
    <a 
      class="ad-banner__link" 
      href="https://goal-life.com/page/method/matrix-eisenhower">
      Want more details?
    </a>
  </aside>
  <main class="todo">
    <section class="todo__add">
      <h3 class="todo__title">Add Item</h3>
      <div class="todo__add-container">
        <input id="new-task" class="todo__add-input" type="text">
        <button class="todo__add-button">Add</button>
      </div>
    </section>
    <section class="todo__unfinished">
      <h3 class="todo__title">Todo</h3>
      <ul id="todo__unfinished-list">
        <li class="todo__item">
          <input class="todo__checkbox" type="checkbox">
          <label class="todo__text" >Pay Bills</label>
          <input class="todo__input" value="Pay Bills" type="text">
          <button class="todo__edit">Edit</button>
          <button class="todo__delete">
            <img src="./assets/icons/remove.svg" alt="Remove icon" class="todo__icon">
          </button>
        </li>
        <li class="todo__item editMode">
          <input class="todo__checkbox" type="checkbox">
          <label class="todo__text">Go Shopping</label>
          <input class="todo__input" value="Go Shopping" type="text">
          <button class="todo__edit">Save</button>
          <button class="todo__delete">
            <img src="./assets/icons/remove.svg" alt="Remove icon" class="todo__icon">
          </button>
        </li>
      </ul>
    </section>
    <section class="todo__completed">
      <h3 class="todo__title">Completed</h3>
      <ul id="todo__completed-list">
        <li class="todo__item">
          <input class="todo__checkbox" type="checkbox" checked>
          <label class="todo__text">See the Doctor</label>
          <input class="todo__input" value="See the Doctor" type="text">
          <button class="todo__edit">Edit</button>
          <button class="todo__delete">
            <img src="./assets/icons/remove.svg" alt="Remove icon" class="todo__icon">
          </button>
        </li>
      </ul>
    </section>
  </main>
  <script src="./scripts/app.js"></script>
 </body>
</html>
